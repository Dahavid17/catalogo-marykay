<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Mary Kay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="hero">
    <nav class="topbar">
      <a class="brand" href="index.html">Mary Kay da Consultora</a>
      <a class="admin-link" href="admin.html">Área da revendedora</a>
    </nav>

    <section class="consultant-banner">
      <div class="consultant-photo">
        <img src="assets/consultora.jpg" alt="Foto da consultora Mary Kay" onerror="this.style.display='none'">
        <span>Foto da consultora</span>
      </div>
      <div>
        <p class="eyebrow">Pedido fácil Mary Kay</p>
        <h1>Escolha com calma e envie pelo WhatsApp.</h1>
        <p>Toque em <strong>Adicionar</strong> nos produtos desejados. O total aparece sempre no fim da tela.</p>
      </div>
    </section>
  </header>

  <main class="shop-layout">
    <section class="shop-main" aria-label="Produtos">
      <div class="easy-search">
        <label for="search">O que você procura?</label>
        <input id="search" type="search" placeholder="Ex: base, batom, máscara" data-search>
      </div>
      <div class="category-strip" data-categories aria-label="Categorias"></div>
      <div class="shop-grid" data-products></div>
    </section>

    <aside class="cart-panel" aria-label="Carrinho">
      <div class="cart-card">
        <div class="cart-heading">
          <div>
            <p class="eyebrow">Meu carrinho</p>
            <h2>Pedido</h2>
          </div>
          <span data-cart-count>0 itens</span>
        </div>
        <div class="cart-list" data-cart-list></div>
      </div>
    </aside>
  </main>

  <section class="checkout-bar" aria-label="Resumo do carrinho">
    <div class="checkout-total">
      <span>Total</span>
      <strong data-cart-total>R$ 0,00</strong>
    </div>
    <div class="checkout-actions">
      <a class="button whatsapp-button disabled" href="#" target="_blank" rel="noreferrer" data-whatsapp-cart>Enviar no WhatsApp</a>
      <button class="button ghost clear-button" type="button" data-clear-cart disabled>Limpar</button>
    </div>
  </section>

  <script src="scripts/store.js"></script>
  <script src="scripts/catalog.js"></script>
</body>
</html>
